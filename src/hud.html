<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>مؤقّت مُستدرِك</title>
<style>
  :root{ --accent:#7c83ff; --card:#171922; --card2:#11131a; --text:#f0eee7; --sub:#9aa0b2; --border:#2b3040; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:transparent; overflow:hidden; }
  body{
    font-family:'Tajawal','Segoe UI',Tahoma,sans-serif; color:var(--text);
    display:flex; align-items:center; justify-content:center; padding:6px;
    -webkit-user-select:none; user-select:none; cursor:default;
  }
  .hud{
    -webkit-app-region:drag;
    width:100%; height:100%; display:flex; align-items:center; gap:10px;
    background:linear-gradient(150deg,var(--card),var(--card2));
    border:1px solid var(--border); border-inline-start:3px solid var(--accent);
    border-radius:15px; padding:8px 11px; box-shadow:0 12px 34px rgba(0,0,0,.5);
  }
  .hud.brk{ --accent:#1f9d6b; }
  .col{ display:flex; flex-direction:column; justify-content:center; min-width:0; flex:1; }
  .time{ font-size:27px; font-weight:800; line-height:1.05; letter-spacing:.5px; font-variant-numeric:tabular-nums; }
  .sub{ font-size:11px; color:var(--sub); font-weight:600; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub b{ color:var(--accent); font-weight:800; }
  .btns{ -webkit-app-region:no-drag; display:flex; gap:5px; align-items:center; }
  .b{
    width:30px; height:30px; border-radius:9px; border:1px solid var(--border);
    background:#0e1016; color:var(--text); font-size:14px; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
    font-family:inherit; transition:transform .08s, background .15s, border-color .15s;
  }
  .b:hover{ background:#171a22; border-color:var(--accent); transform:translateY(-1px); }
  .b:active{ transform:translateY(0); }
  .b.pri{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:800; }
  .b.x{ font-size:13px; color:var(--sub); }
</style>
</head>
<body>
  <div class="hud" id="hud">
    <div class="col">
      <div class="time" id="time">00:00</div>
      <div class="sub" id="sub">—</div>
    </div>
    <div class="btns">
      <button class="b pri" id="pp" title="بدء/إيقاف">▶</button>
      <button class="b x" id="close" title="إخفاء الويدجت">✕</button>
    </div>
  </div>
<script>
  var st = { running:false, isBreak:false, remainSec:0, endAt:0, label:'جلسة سعي', accent:'#7c83ff' };
  var elHud=document.getElementById('hud'), elTime=document.getElementById('time'),
      elSub=document.getElementById('sub'), elPP=document.getElementById('pp'), elClose=document.getElementById('close');

  function fmt(sec){ sec=Math.max(0,Math.round(sec)); var m=Math.floor(sec/60),s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
  function endsAtText(ms){
    try{ return new Date(ms).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }catch(e){ return ''; }
  }
  function curRemain(){
    if(st.running && st.endAt) return Math.max(0, Math.round((st.endAt - Date.now())/1000));
    return Math.max(0, st.remainSec||0);
  }
  function paint(){
    var r=curRemain();
    elTime.textContent=fmt(r);
    if(st.running && st.endAt) elSub.innerHTML=(st.label||'')+' · ينتهي <b>'+endsAtText(st.endAt)+'</b>';
    else elSub.textContent=(st.label||'')+' · متوقّف';
    elHud.classList.toggle('brk', !!st.isBreak);
    if(st.accent) elHud.style.setProperty('--accent', st.accent);
    elPP.textContent = st.running ? '⏸' : '▶';
    elPP.title = st.running ? 'إيقاف مؤقّت' : 'بدء';
  }
  function send(cmd){ try{ if(window.noahAPI && noahAPI.timerWidget) noahAPI.timerWidget.command(cmd); }catch(e){} }

  elPP.addEventListener('click', function(){ send(st.running?'pause':'start'); });
  elClose.addEventListener('click', function(){ send('hud-off'); });

  try{ if(window.noahAPI && noahAPI.timerWidget) noahAPI.timerWidget.onHudState(function(s){ if(s){ st=s; paint(); } }); }catch(e){}
  setInterval(function(){ if(st.running) paint(); }, 500);   // العدّاد يدقّ محلياً من endAt
  paint();
</script>
</body>
</html>
