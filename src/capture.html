<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<title>التقاط سريع</title>
<style>
  :root{ --bg:#11131a; --card:#1c1f29; --text:#eceae3; --sub:#8b90a0; --accent:#7c83ff; --border:#2a2e3b; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Tajawal','Segoe UI',Tahoma,sans-serif; background:transparent; color:var(--text);
    display:flex; align-items:center; justify-content:center; padding:10px; -webkit-user-select:none; user-select:none;
  }
  .cap{
    width:100%; background:linear-gradient(145deg,var(--card),var(--bg)); border:1px solid var(--border);
    border-radius:16px; padding:16px 18px; box-shadow:0 18px 50px rgba(0,0,0,.5);
    -webkit-app-region:drag;
  }
  .cap-h{ font-size:13px; font-weight:700; color:var(--accent); margin-bottom:10px; display:flex; gap:6px; align-items:center; }
  .cap-h span{ color:var(--sub); font-weight:500; }
  input{
    -webkit-app-region:no-drag; width:100%; font-family:inherit; font-size:16px; font-weight:600;
    color:var(--text); background:#0e1016; border:1px solid var(--border); border-radius:11px;
    padding:12px 14px; outline:none; -webkit-user-select:text; user-select:text;
  }
  input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(124,131,255,.18); }
  input::placeholder{ color:#5b6072; font-weight:500; }
  .cap-f{ display:flex; justify-content:space-between; align-items:center; margin-top:9px; font-size:11px; color:var(--sub); }
  kbd{ background:#0e1016; border:1px solid var(--border); border-radius:5px; padding:1px 6px; font-family:inherit; font-size:11px; }
</style>
</head>
<body>
  <div class="cap">
    <div class="cap-h">⚡ التقاط سريع <span>— مُستدرِك</span></div>
    <input id="t" type="text" placeholder="اكتب فكرتك أو مهمتك ثم Enter…" autocomplete="off" spellcheck="false">
    <div class="cap-f">
      <span><kbd>Enter</kbd> للحفظ · <kbd>Esc</kbd> للإلغاء</span>
      <span>تذهب إلى «استجلاء الذهن»</span>
    </div>
  </div>
<script>
  var t = document.getElementById('t');
  function submit(){
    var v = (t.value || '').trim();
    if (v && window.noahAPI && window.noahAPI.captureSubmit) { window.noahAPI.captureSubmit(v); }
    else if (window.noahAPI && window.noahAPI.captureCancel) { window.noahAPI.captureCancel(); }
  }
  function cancel(){ if (window.noahAPI && window.noahAPI.captureCancel) window.noahAPI.captureCancel(); }
  t.addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); submit(); }
    else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
  });
  window.addEventListener('load', function(){ t.focus(); });
</script>
</body>
</html>
