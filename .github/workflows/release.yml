name: Release

# Manual on purpose: bump "version" in package.json, add a CHANGELOG entry, push, then run this
# workflow from the Actions tab. electron-builder builds the Windows installer + portable exe and
# uploads them (with latest.yml, which the in-app updater reads) to the GitHub release v<version>.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
